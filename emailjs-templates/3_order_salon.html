<!-- Template naam: order_salon -->
<!-- To email: {{salon_email}} -->
<!-- Subject: Nieuwe bestelling – {{customer_name}} -->

<!DOCTYPE html>
<html lang="nl">
<head><meta charset="UTF-8"><style>
  body { font-family: Georgia, serif; background: #f5f0eb; margin: 0; padding: 0; }
  .wrap { max-width: 560px; margin: 30px auto; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  .header { background: #6c5b7a; padding: 36px 40px; text-align: center; }
  .header h1 { color: #fff; margin: 0; font-size: 1.5rem; letter-spacing: 1px; }
  .header p { color: rgba(255,255,255,0.75); margin: 6px 0 0; font-size: 0.9rem; }
  .body { padding: 36px 40px; }
  .body h2 { color: #6c5b7a; font-size: 1.1rem; margin: 0 0 20px; }
  .card { background: #f5f0eb; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .card h3 { margin: 0 0 14px; color: #6c5b7a; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
  .row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid rgba(0,0,0,0.06); font-size: 0.95rem; }
  .row:last-child { border-bottom: none; }
  .label { color: #999; }
  .value { color: #1a1a1a; font-weight: 600; }
  .items-box { background: #fff; border: 1px solid #e8e0d6; border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; white-space: pre-line; font-size: 0.9rem; color: #333; line-height: 2; }
  .total-row { display: flex; justify-content: space-between; padding: 14px 20px; background: #6c5b7a; border-radius: 10px; color: #fff; font-weight: 700; font-size: 1rem; }
  .footer { background: #f5f0eb; padding: 20px 40px; text-align: center; font-size: 0.8rem; color: #aaa; }
</style></head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Hevanly's Beautybar</h1>
    <p>Nieuwe bestelling ontvangen</p>
  </div>
  <div class="body">
    <h2>Er is een nieuwe bestelling geplaatst</h2>

    <div class="card">
      <h3>Klantgegevens</h3>
      <div class="row"><span class="label">Naam</span><span class="value">{{customer_name}}</span></div>
      <div class="row"><span class="label">E-mail</span><span class="value">{{customer_email}}</span></div>
      <div class="row"><span class="label">Leveradres</span><span class="value">{{customer_address}}</span></div>
    </div>

    <div class="card">
      <h3>Bestelde producten</h3>
      <div class="items-box">{{order_items}}</div>
      <div class="total-row"><span>Totaal</span><span>{{order_total}}</span></div>
    </div>
  </div>
  <div class="footer">Hevanly's Beautybar · Graatakker 118 Bus B, 2300 Turnhout</div>
</div>
</body>
</html>
